<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>测试授权入口 · Filmtest</title>
  <link rel="stylesheet" href="/css/platform.css" />
</head>
<body>
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">f.</span>filmtest<span class="brand-caption">自我探索空间</span></a><a href="/#tests">返回测试目录</a></header>
  <main class="wrap access-main">
    <section class="entry-panel access-panel">
      <p class="eyebrow">YOUR EXPLORATION STARTS HERE</p>
      <h1 id="accessTitle">测试授权入口</h1>
      <p class="muted">请输入授权码进入测试。已有专属链接，请直接打开原链接。</p>
      <label for="accessCodeInput">公共授权码</label>

      <input
        id="accessCodeInput"
        class="access-input"
        type="text"
        placeholder="请输入授权码"
        autocomplete="off"
      />

      <button id="enterTestBtn" class="button primary" type="button">验证并进入测试 →</button>

      <p id="accessStatusText" class="muted" role="status" aria-live="polite"></p>
      <a href="/" class="text-link">← 返回平台首页</a>
    </section>
  </main>

  <script src="tests/definitions.js"></script>
  <script src="tests/registry.js"></script>
  <script src="tests/villain/manifest.js"></script>
  <script src="js/access.js"></script>
</body>
</html>
