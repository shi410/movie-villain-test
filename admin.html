<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>链接生成器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="screen active">
      <h1>链接生成器</h1>
      <p class="subtitle">批量生成一次性测试链接</p>

      <input id="countInput" class="admin-input" type="number" value="10" min="1" max="1000" />

      <button id="generateBtn" class="btn red">生成链接</button>
      <button id="copyBtn" class="btn light">复制全部</button>

      <p id="statusText" class="subtitle"></p>

      <textarea id="linksOutput" class="links-output" readonly></textarea>

      <hr />

      <h2>公共授权通道</h2>
      <p class="subtitle">固定授权码，不限人数，不限次数，可随时开启或关闭</p>

      <input
        id="adminSecretInput"
        class="admin-input"
        type="password"
        placeholder="请输入管理员密码"
      />

      <input
        id="publicAccessCodeInput"
        class="admin-input"
        type="text"
        placeholder="固定授权码"
      />

      <button id="loadPublicAccessBtn" class="btn light">读取当前配置</button>
      <button id="updatePublicAccessCodeBtn" class="btn light">修改授权码</button>
      <button id="togglePublicAccessBtn" class="btn red">开启公共通道</button>

      <p id="publicAccessStatusText" class="subtitle">当前状态：未读取</p>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
